<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>길따라 식당지도</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" />
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <aside class="panel">
    <header class="panel-head">
      <h1>길따라 식당지도</h1>
      <form id="search-form" autocomplete="off">
        <div class="search-row">
          <input id="q" name="q" type="search" placeholder="도로명 입력 (예: 테헤란로, 대전 중앙로)" required />
          <button type="submit" id="search-btn">검색</button>
        </div>
        <label class="check">
          <input type="checkbox" id="side" />
          골목길(○○로1길 등)도 포함
        </label>
      </form>
      <p id="status" class="status" role="status"></p>
      <div id="choices" class="choices" hidden></div>
    </header>

    <section id="detail" class="detail" hidden></section>

    <section id="results" class="results" hidden>
      <div class="summary" id="summary"></div>
      <div class="chips" id="chips"></div>
      <input id="filter" type="search" class="filter" placeholder="목록에서 이름·업종 찾기" />
      <ul id="list" class="list"></ul>
    </section>

    <section id="intro" class="intro">
      <p>도로 이름을 입력하면 그 길에 주소가 있는 식당을 모아 지도에 보여줍니다.</p>
      <ul>
        <li>같은 이름의 도로가 여러 지역에 있으면 지역을 고를 수 있어요.</li>
        <li>지역을 같이 적으면 바로 찾아요. 예: <em>대전 중앙로</em>, <em>강남구 테헤란로</em></li>
        <li>지도에서 점을 누르면 식당 정보가 나옵니다.</li>
      </ul>
      <p class="source">자료: 소상공인시장진흥공단 상가(상권)정보 · 지도 © OpenStreetMap</p>
    </section>
  </aside>

  <main id="map" aria-label="지도"></main>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="app.js"></script>
</body>
</html>
